[project]
name = "repo-name--prod"
version = "0.1.0"
description = "backend production server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "appengine-python-standard>=1.1.10",
  "cachetools>=6.2.1",
  "flask>=3.1.3",
  "google-api-python-client>=2.185.0",
  "google-cloud-logging>=3.12.1",
  "gunicorn>=26.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytype>=2024.10.11",
  "ruff>=0.15.10",
  "setuptools>=80.9.0",
]

[tool.uv]
required-version=">=0.11.5"

[tool.ruff]
indent-width = 2
line-length = 80

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# enable lint rules https://docs.astral.sh/ruff/rules/
extend-select = [
  # https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
  # isort https://docs.astral.sh/ruff/rules/#isort-i
  "I",
  # pylint convention https://docs.astral.sh/ruff/rules/#convention-plc
  "PLC",
  # pylint errors https://docs.astral.sh/ruff/rules/#error-ple
  "PLE",
  # pyupgrade https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "UP",
]

[tool.ruff.lint.isort]
# Apply the google profile
# https://pycqa.github.io/isort/docs/configuration/profiles.html
force-single-line = true
force-sort-within-sections = true
order-by-type = false
single-line-exclusions = ["collections.abc", "typing"]
